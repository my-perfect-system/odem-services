---
- name: Install gpg package
  ansible.builtin.apt:
    name: gpg
    state: present
    update_cache: true
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Download Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"
    force: true
- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/grafana.asc]
      https://apt.grafana.com stable main
    filename: grafana
    state: present
    update_cache: true
- name: Install alloy package
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
- name: Add alloy user to systemd-journal group
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    groups: systemd-journal
    append: true
- name: Add alloy user to adm group
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    groups: adm
    append: true
- name: Add alloy user to docker group
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    groups: docker
    append: true
  when: >-
    'container_default_metrics' in monitoring_features | default([]) or
    'container_default_logs' in monitoring_features | default([]) or
    'container_cadvisor_metrics' in monitoring_features | default([])
- name: Create alloy state directory
  ansible.builtin.file:
    path: /var/lib/alloy
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_user }}"
    recurse: true
- name: Template alloy default env file
  ansible.builtin.template:
    src: alloy.default.j2
    dest: "{{ alloy_env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy
- name: Enable and start alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
