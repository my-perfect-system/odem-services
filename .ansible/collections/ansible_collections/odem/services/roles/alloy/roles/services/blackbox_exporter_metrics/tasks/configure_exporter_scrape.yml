---
- name: Assert blackbox probe targets var set
  ansible.builtin.assert:
    that:
      - blackbox_probe_targets | default([]) | length > 0
    fail_msg: >-
      blackbox_probe_targets must be set (via host_vars or extra vars) to
      configure blackbox exporter scrapes.
- name: Template blackbox_exporter_scrape.alloy
  ansible.builtin.template:
    src: blackbox_exporter_scrape.alloy.j2
    dest: "{{ alloy_config_dir }}/blackbox_exporter_scrape.alloy"
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy
