---
- name: Assert PBS API token vars set
  ansible.builtin.assert:
    that:
      - pbs_api_token_name | default('') | length > 0
      - pbs_api_token | default('') | length > 0
    fail_msg: >-
      pbs_api_token_name and pbs_api_token must be set to
      install pbs-exporter.
- name: Set exporter architecture fact
  ansible.builtin.set_fact:
    _pbs_exporter_arch: >-
      {{ 'arm64' if (ansible_architecture == 'aarch64')
         else 'amd64' }}
- name: Create pbs-exporter install temp directory
  ansible.builtin.file:
    path: /tmp/pbs-exporter-install
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Download pbs-exporter release tarball
  ansible.builtin.get_url:
    url: "{{ _pbs_url }}"
    dest: "{{ _pbs_dest }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  vars:
    _pbs_url: >-
      https://github.com/natrontech/pbs-exporter/releases/download/
      {{ pbs_exporter_version }}/pbs-exporter_
      {{ pbs_exporter_version }}_linux_{{ _pbs_exporter_arch }}.tar.gz
    _pbs_dest: >-
      /tmp/pbs-exporter-install/pbs-exporter_
      {{ pbs_exporter_version }}_linux_{{ _pbs_exporter_arch }}.tar.gz
  register: _pbs_exporter_download
- name: Extract pbs-exporter tarball
  ansible.builtin.unarchive:
    src: "{{ _pbs_dest }}"
    dest: /tmp/pbs-exporter-install
    remote_src: true
    creates: /tmp/pbs-exporter-install/pbs-exporter
- name: Find named pbs-exporter binary
  ansible.builtin.find:
    paths: /tmp/pbs-exporter-install
    patterns: "pbs-exporter"
    file_type: file
  register: _pbs_exporter_named
- name: Find any file in install directory
  ansible.builtin.find:
    paths: /tmp/pbs-exporter-install
    patterns: "*"
    file_type: file
  register: _pbs_exporter_all
  when: _pbs_exporter_named.matched | int == 0
- name: Set exporter source from named match
  ansible.builtin.set_fact:
    _pbs_exporter_src: "{{ _pbs_exporter_named.files[0].path }}"
  when: _pbs_exporter_named.matched | int > 0
- name: Set exporter source from fallback match
  ansible.builtin.set_fact:
    _pbs_exporter_src: "{{ _pbs_exporter_all.files[0].path }}"
  when:
    - _pbs_exporter_named.matched | int == 0
    - _pbs_exporter_all.matched | int > 0
- name: Assert exporter binary found
  ansible.builtin.assert:
    that: _pbs_exporter_src is defined
    fail_msg: "Binary not found in extracted tarball."
- name: Install pbs-exporter binary
  ansible.builtin.copy:
    src: "{{ _pbs_exporter_src }}"
    dest: "{{ pbs_exporter_bin_dir }}/pbs-exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart pbs-exporter
- name: Template pbs-exporter default env file
  ansible.builtin.template:
    src: pbs-exporter.default.j2
    dest: /etc/default/pbs-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart pbs-exporter
- name: Template pbs-exporter systemd unit
  ansible.builtin.template:
    src: pbs-exporter.service.j2
    dest: /etc/systemd/system/pbs-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart pbs-exporter
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
- name: Enable and start pbs-exporter service
  ansible.builtin.systemd:
    name: pbs-exporter
    enabled: true
    state: started
