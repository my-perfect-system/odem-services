---


- name: Clone mps-monitoring repository
  ansible.builtin.git:
    repo: "{{ monitoring_repo_url }}"
    dest: "{{ monitoring_repo_dest }}"
    version: "{{ monitoring_repo_version }}"
    force: true
  become: true

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ monitoring_repo_dest }}"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true


- name: Render .env configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_repo_dest }}/.env"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Materialize service config files from examples
  ansible.builtin.copy:
    src: "{{ monitoring_repo_dest }}/{{ item.src }}"
    dest: "{{ monitoring_repo_dest }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ monitoring_config_files }}"
  become: true

- name: Prepare data directories via setup script
  ansible.builtin.command:
    cmd: bash scripts/setup.sh
    chdir: "{{ monitoring_repo_dest }}"
  become: true
  when: monitoring_enable_setup | bool
